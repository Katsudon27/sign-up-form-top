<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Sign Up Form</title>
    <link href="styles/style.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <!-- Sidebar with logo and credits for background image -->
    <div id="sidebar">
      <div id="logo-area">
        <img src="images/odin_logo.png" alt="Odin Logo" id="logo">
        <h1 id="logo-text">ODIN</h1>
      </div>
      <p>Photo by Jonny Auh on <a href="https://unsplash.com/photos/river-in-mossy-iceland-canyon-z99iWocuDt0">Unsplash</a></p>
    </div>
    <div id="main-content">
      <form action="" method="post">
        <!-- Call-to-action text -->
        <section id="cta-section">
          <div id="cta-text">
              <h2>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>
                Sign up <em>now</em> to get started.
              </h2>
              <br>
              <h2>You <em>know</em> you want to.</h2>
          </div>
        </section>

        <!-- form controls for user input -->
        <section id="form-control-section">
          <h2>Let's do this!</h2>
          <div class="form-control-row">
            <p>
              <label for="first_name">FIRST NAME</label>
              <input type="text" id="first_name" name="first_name" required />
            </p>

            <p>
              <label for="last_name">LAST NAME</label>
              <input type="text" id="last_name" name="last_name" required />
            </p>
          </div>
          <div class="form-control-row">
            <p>
              <label for="user_email">EMAIL</label>
              <input type="email" id="user_email" name="email" required >
            </p>

            <p>
              <label for="phone">PHONE NUMBER</label>
              <input type="tel" id="phone" name="phone" required />
            </p>
          </div class="form-control-row">
          <div class="form-control-row">
            <p>
              <label for="user_password">PASSWORD</label>
              <input type="password" id="user_password" name="user_password" required />
            </p>

            <p>
              <label for="confirmed_password">CONFIRM PASSWORD</label>
              <input type="password" id="confirmed_password" name="confirmed_password" required />
            </p>
          </div>
        </section>

        <section id="form-submission">
          <button type="submit">Create Account</button>
          <p>Already have an account? <strong><a href="">Log in</a></strong></p>
        </section>
      </form>
    </div>
  </body>
</html>
